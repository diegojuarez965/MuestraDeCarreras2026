<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/estilo-muestra.css" />
  <link rel="shortcut icon" href="img/isotipo.jpeg" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="components/navegador.js"></script>
  <script src="components/pie-pagina.js"></script>

  <title>Muestra de Carreras</title>
</head>

<body>
  <section class="contenido">
    <menu-navegador></menu-navegador>
    <h1 class="sr-only">Muestra Informativa de Carreras 2026 - Universidad Nacional del Sur</h1>

    <!--  <section class="presentacion">
        <div class="presentacion-contenedor">
          <div class="muestra-imagen"><
            <img src="img/muestra.png" alt="Logo Muestra de Carreras" />
          </div>
          <div class="muestra-texto">
            <h2><span>MIC</span> | Edición 2026</h2>
            <p>
              Los días 13 y 14 de agosto de 2026 tendrá lugar la 34° edición de
              la Muestra Informativa de Carreras de Nivel Superior. El evento se

          </div>

    <section class="presentacion">
      <div class="muestra-imagen">
        <img src="img/muestra.png"
          alt="Banner de la Muestra Informativa de Carreras (MIC) 2026 de la Universidad Nacional del Sur">
      </div>
    </section>

    <section class="presentacion-responsive">
      <div>

        <div class="pr-1">
          <img src="img/mic-responsive.png" alt="Logo de la Muestra Informativa de Carreras 2026">
        </div>

        <div class="pr-2">
          <img src="img/mic-texto.png"
            alt="Información del evento: 13 y 14 de agosto de 9 a 18 hs. en el Campus Palihue">
        </div>

      </div>
    </section>

    <section class="video">
      <div class="videos">
        <iframe style="width: 100%; height: 100%; display: block" src="https://www.youtube.com/embed/QEZb4T83TgI"
          title="YouTube video player" frameborder="0" allow="
              accelerometer;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            " referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </section>

    <section class="buscador">
      <div class="cartelera">
        <div class="div-img">
          <img src="img/cartelera.png" alt="Cartelera Muestra de Carreras 2026" />
        </div>
      </div>

      <div class="buscar">
        <div class="card">
          <div class="campo">
            <label for="institucion">Institución</label>
            <select id="institucion">
              <option value="">Cualquiera...</option>
            </select>
          </div>

          <div class="campo">
            <label for="area">Área Disciplinar</label>
            <select id="area">
              <option value="">Cualquiera...</option>
            </select>
          </div>

          <div class="campo">
            <label for="modalidad">Modalidad de Dictado</label>
            <select id="modalidad">
              <option value="">Cualquiera...</option>
            </select>
          </div>

          <div class="campo">
            <label for="duracion">Duración</label>
            <select id="duracion">
              <option value="">Cualquiera...</option>
            </select>
          </div>

          <div class="campo">
            <label for="localidad">Localidad de Dictado</label>
            <select id="localidad">
              <option value="">Cualquiera...</option>
            </select>
          </div>

          <div class="campo">
            <label for="arancelada">¿Es arancelada?</label>
            <select id="arancelada">
              <option value="">Cualquiera...</option>
            </select>
          </div>

          <div class="buscar-botones">
            <button type="button" class="btn-limpiar" onclick="limpiarTodo()">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h-12"></path>
                <path d="M16 14l-9 -9"></path>
                <path
                  d="M18 17a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2c0 -1.5 1 -2.5 2 -3c1.5 -1 2.5 -.5 4 -.5h6c1.5 0 2.5 -.5 4 .5c1 1 1 2 2 3z">
                </path>
              </svg>
              Limpiar
            </button>
            <button type="button" class="btn-buscar" onclick="buscar()">
              Buscar
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>

          <div class="resultados" id="resultados" style="display: none">
            <p class="resultados-header" id="resultados-header"></p>
            <div class="resultados-grid" id="resultados-grid"></div>
            <div class="paginacion" id="paginacion"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="cronograma">
      <div>
        <a href="actividades.html">
          <img src="img/cronograma.png" alt="Cronograma de la Muestra de Carreras 2026" />
        </a>
      </div>
    </section>
  </section>

  <pie-pagina></pie-pagina>

  <script src="js/propuestas.js"></script>
  <script src="js/buscador.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>

</html>
